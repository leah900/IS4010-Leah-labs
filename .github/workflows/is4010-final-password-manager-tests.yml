name: Final Password Manager Tests

on:
  push:
    paths:
      - 'is4010-final-password-manager/**'
  pull_request:
    paths:
      - 'is4010-final-password-manager/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r is4010-final-password-manager/requirements.txt
          pip install -e is4010-final-password-manager
      - name: Run tests
        run: |
          cd is4010-final-password-manager
          pytest -q
