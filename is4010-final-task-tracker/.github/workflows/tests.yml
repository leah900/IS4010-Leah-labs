name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r is4010-final-task-tracker/requirements.txt
          pip install -e ./is4010-final-task-tracker
      - name: Run tests
        run: pytest
